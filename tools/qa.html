<!doctype html><html><head><meta charset="utf-8"><style>
body{margin:0;background:#9db0c4;font:11px -apple-system;}
#g{display:grid;grid-template-columns:repeat(5,250px);}
.c{height:215px;width:250px;position:relative;border-right:1px solid #6b7c8f;border-bottom:1px solid #6b7c8f;
 background:repeating-linear-gradient(to top,transparent 0 19px,rgba(0,0,0,.14) 19px 20px);overflow:hidden}
.c img{position:absolute;bottom:0;left:50%;transform:translateX(-50%)}
.c span{position:absolute;top:2px;left:4px;font-weight:700;background:#fffa;padding:0 3px;border-radius:3px}
</style></head><body><div id=g></div>
<script src="../src/renderer/animations.js"></script>
<script>
const q=new URLSearchParams(location.search); const frames=JSON.parse(q.get('f')||'{}'); const mode=q.get('mode')||'one';
const BASE=0.3;
const page=+(q.get('p')||0);
const list=q.get('list')?q.get('list').split(','):TitoAnim.ANIMATIONS.slice(page*15,page*15+15);
for(const n of list){
  const c=document.createElement('div');c.className='c';
  const fr = mode==='one' ? [frames[n]||0] : [0];
  const i=new Image();const k=frames[n]||0;
  i.src=`../assets/sprites/${n}/${n}_${k}.png`;
  i.onload=()=>{const s=BASE*TitoAnim.sizeFactor(n);i.style.width=Math.round(i.naturalWidth*s)+'px';i.style.height=Math.round(i.naturalHeight*s)+'px'};
  c.innerHTML=`<span>${n} f${k}</span>`;c.appendChild(i);g.appendChild(c);
}
</script></body></html>
