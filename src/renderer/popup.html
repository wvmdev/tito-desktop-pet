<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'">
  <title>Tito</title>
  <link rel="stylesheet" href="glass.css">
  <style>
    html, body { margin: 0; height: 100%; background: transparent; overflow: hidden;
      font: 13px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      user-select: none; -webkit-user-select: none; color: var(--ink); }
    .bar {
      position: absolute; left: 7px; right: 7px; top: 5px; height: 36px;
      display: flex; align-items: center; padding: 3px; gap: 2px;
    }
    button {
      flex: 1; height: 30px; display: flex; align-items: center; justify-content: center;
      border: 0; background: transparent; color: inherit; padding: 0;
      border-radius: 999px; cursor: pointer; position: relative; z-index: 1;
      transition: background-color 120ms;
    }
    button:hover { background: var(--glass-hover); }
    button:active { background: var(--glass-press); }
    button:focus-visible { outline: 2px solid var(--accent); outline-offset: -2px; }
    svg { width: 17px; height: 17px; stroke: currentColor; fill: none; stroke-width: 1.9;
      stroke-linecap: round; stroke-linejoin: round; }
    .divider { width: 1px; height: 18px; background: var(--glass-divider); flex: none; }
    .note { position: absolute; inset: 0; display: none; align-items: center; justify-content: center;
      color: var(--ink-muted); font-size: 11px; z-index: 2; white-space: nowrap; }
    .bar.noting button, .bar.noting .divider { visibility: hidden; }
    .bar.noting .note { display: flex; }
    /* compact pill: tighter shadow so it fits the small transparent window */
    .bar.glass { box-shadow: 0 3px 9px var(--glass-shadow), 0 1px 2px rgba(0, 0, 0, 0.08),
      inset 0 1px 0 var(--glass-rim), inset 0 -1px 0 var(--glass-rim-soft), inset 0 0 10px rgba(255, 255, 255, 0.18); }
  </style>
</head>
<body>
  <div class="bar glass pill pop-in" id="bar">
    <button id="chat" aria-label="Chat" title="Chat">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M21 12a8 8 0 0 1-11.6 7.1L4 20.5l1.4-4.9A8 8 0 1 1 21 12z"/></svg>
    </button>
    <div class="divider" aria-hidden="true"></div>
    <button id="settings" aria-label="Settings" title="Settings">
      <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.9l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.9-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.6 1.7 1.7 0 0 0-1.9.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.9 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.6-1.1 1.7 1.7 0 0 0-.3-1.9l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.9.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.9-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.9V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"/></svg>
    </button>
    <div class="note" id="note"></div>
  </div>
  <script src="popup.js"></script>
</body>
</html>
