<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; img-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'">
  <title>Tito</title>
  <style>
    html, body {
      margin: 0; padding: 0; width: 100%; height: 100%;
      background: transparent; overflow: hidden;
      user-select: none; -webkit-user-select: none;
    }
    /* Frames are trimmed to different sizes, so render at one fixed scale
       (height set in JS from natural size) and anchor at bottom-centre: the paws stay put. */
    #stage {
      position: absolute; inset: 0;
      display: flex; align-items: flex-end; justify-content: center;
    }
    #tito {
      display: block;
      pointer-events: auto;
      -webkit-user-drag: none;
      transform-origin: 50% 100%;
    }
  </style>
</head>
<body>
  <div id="stage"><img id="tito" alt="Tito" draggable="false"></div>
  <script src="animations.js"></script>
  <script src="pet.js"></script>
</body>
</html>
