<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; img-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'">
  <title>Tito Settings</title>
  <link rel="stylesheet" href="glass.css">
  <style>
    /* Body is transparent: macOS draws a native blur ("vibrancy") behind the whole window.
       Cards are drawn glass on top of it. */
    * { box-sizing: border-box; }
    html, body { margin: 0; background: transparent; color: var(--ink);
      font: 13px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
    body.no-vibrancy { background: linear-gradient(180deg, #eef2f6, #e3e8ee); }
    @media (prefers-color-scheme: dark) { body.no-vibrancy { background: linear-gradient(180deg, #23262d, #1b1d22); } }
    .drag { -webkit-app-region: drag; height: 38px; }
    main { padding: 0 22px 26px; }
    h1 { font-size: 20px; margin: 0 0 2px; letter-spacing: -0.01em; }
    p.lead { color: var(--ink-muted); margin: 0 0 4px; }
    h2 { font-size: 11.5px; text-transform: uppercase; letter-spacing: .07em; color: var(--ink-muted); margin: 20px 4px 8px; }
    .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
    label.card {
      display: flex; gap: 10px; align-items: flex-start; padding: 11px;
      border-radius: 16px; cursor: pointer; transition: transform 120ms, box-shadow 120ms;
    }
    label.card > * { position: relative; z-index: 1; }
    label.card:hover { transform: translateY(-1px); }
    label.card:has(input:checked) { outline: 2px solid var(--accent); outline-offset: -2px; }
    label.card:has(input:focus-visible) { outline: 3px solid var(--accent); }
    label.card input { position: absolute; opacity: 0; pointer-events: none; }
    label.card img { width: 54px; height: 54px; object-fit: contain; flex: none; }
    .name { font-weight: 650; font-size: 14px; margin-bottom: 2px; }
    .desc { color: var(--ink-muted); font-size: 12px; line-height: 1.35; }
    .row { display: flex; align-items: center; gap: 12px; padding: 12px 16px; border-radius: 16px; }
    .row > * { position: relative; z-index: 1; }
    .row label { font-weight: 600; }
    .row input[type=range] { flex: 1; accent-color: var(--accent); }
    .row output { min-width: 42px; text-align: right; font-variant-numeric: tabular-nums; font-weight: 600; }
    .hint { color: var(--ink-muted); font-size: 12px; margin: 6px 4px 0; }
    .saved { color: var(--accent); font-size: 12px; min-height: 16px; margin: 8px 4px 0; }
    .soon { color: var(--ink-muted); font-size: 12px; padding: 12px 16px; border-radius: 16px; }
    .soon > * { position: relative; z-index: 1; }
  </style>
</head>
<body>
  <div class="drag"></div>
  <main>
    <h1>Settings</h1>
    <p class="lead">Changes apply immediately.</p>

    <h2>Personality</h2>
    <div class="grid" id="personalities" role="radiogroup" aria-label="Personality"></div>
    <div class="saved" id="saved" aria-live="polite"></div>

    <h2>Size</h2>
    <div class="row glass">
      <label for="size">Tito's size</label>
      <input type="range" id="size" step="0.05">
      <output id="sizeVal" for="size"></output>
    </div>
    <p class="hint">Tip: double-click Tito to change his size from anywhere.</p>

    <h2>AI assistant</h2>
    <div class="soon glass"><span>AI provider, API key and security level come next.</span></div>
  </main>
  <script src="settings.js"></script>
</body>
</html>
