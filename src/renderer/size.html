<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'">
  <title>Tito size</title>
  <link rel="stylesheet" href="glass.css">
  <style>
    html, body { margin: 0; height: 100%; background: transparent; overflow: hidden;
      font: 13px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      user-select: none; -webkit-user-select: none; color: var(--ink); }
    .bar {
      position: absolute; left: 7px; right: 7px; top: 5px; height: 36px;
      display: flex; align-items: center; gap: 7px; padding: 0 11px;
    }
    .bar > * { position: relative; z-index: 1; }
    .cat { flex: none; color: var(--ink-muted); }
    .cat svg { display: block; fill: currentColor; }
    input[type=range] {
      flex: 1; min-width: 0; -webkit-appearance: none; appearance: none; height: 4px; border-radius: 2px;
      background: linear-gradient(90deg, var(--accent) var(--pct, 50%), var(--glass-divider) var(--pct, 50%));
      outline: none; cursor: pointer;
    }
    input[type=range]::-webkit-slider-thumb {
      -webkit-appearance: none; width: 16px; height: 16px; border-radius: 50%;
      background: linear-gradient(180deg, #fff, #eef2f6);
      border: 1px solid rgba(0, 0, 0, 0.12);
      box-shadow: 0 1px 4px rgba(0, 0, 0, 0.25), inset 0 1px 0 #fff;
    }
    input[type=range]:focus-visible::-webkit-slider-thumb { outline: 2px solid var(--accent); outline-offset: 2px; }
    output { min-width: 32px; text-align: right; font-variant-numeric: tabular-nums; font-weight: 600; font-size: 11.5px; }
    /* compact pill: tighter shadow so it fits the small transparent window */
    .bar.glass { box-shadow: 0 3px 9px var(--glass-shadow), 0 1px 2px rgba(0, 0, 0, 0.08),
      inset 0 1px 0 var(--glass-rim), inset 0 -1px 0 var(--glass-rim-soft), inset 0 0 10px rgba(255, 255, 255, 0.18); }
  </style>
</head>
<body>
  <div class="bar glass pill pop-in">
    <span class="cat" aria-hidden="true"><svg width="9" height="9" viewBox="0 0 24 24"><path d="M4 3l4 5h8l4-5v11a8 8 0 0 1-16 0z"/></svg></span>
    <input type="range" id="size" aria-label="Tito size" step="0.05">
    <span class="cat" aria-hidden="true"><svg width="14" height="14" viewBox="0 0 24 24"><path d="M4 3l4 5h8l4-5v11a8 8 0 0 1-16 0z"/></svg></span>
    <output id="val" for="size"></output>
  </div>
  <script src="size.js"></script>
</body>
</html>
