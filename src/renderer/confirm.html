<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; img-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'">
  <title>Tito asks</title>
  <link rel="stylesheet" href="glass.css">
  <style>
    * { box-sizing: border-box; }
    [hidden] { display: none !important; }
    html, body { margin: 0; height: 100%; background: transparent; overflow: hidden; color: var(--ink);
      font: 13px/1.4 -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; user-select: none; -webkit-user-select: none; }
    .card { position: absolute; inset: 8px 8px 14px; border-radius: 18px; padding: 12px 14px; display: flex; flex-direction: column; gap: 6px;
      -webkit-app-region: drag; }
    .card > * { position: relative; z-index: 1; }
    .head { display: flex; align-items: center; gap: 8px; color: var(--ink-muted); font-size: 11.5px; font-weight: 700; letter-spacing: .05em; text-transform: uppercase; }
    .head img { width: 22px; height: 22px; object-fit: contain; }
    .title { font-size: 15px; font-weight: 700; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .detail { font: 12px ui-monospace, SFMono-Regular, Menlo, monospace; background: rgba(127, 127, 127, .14); border-radius: 8px;
      padding: 5px 8px; max-height: 38px; overflow: hidden; word-break: break-all; }
    .reason { color: var(--ink-muted); font-size: 12px; overflow: hidden; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; }
    .spacer { flex: 1; }
    .row { display: flex; gap: 8px; align-items: center; -webkit-app-region: no-drag; }
    .why { flex: 1; color: var(--ink-muted); font-size: 11px; }
    button { font: inherit; font-weight: 650; border-radius: 10px; padding: 6px 16px; cursor: pointer; border: 1px solid var(--glass-divider);
      background: var(--glass-hover); color: var(--ink); }
    button.allow { background: var(--accent); color: #fff; border-color: transparent; }
    button:disabled { opacity: .45; cursor: default; }
  </style>
</head>
<body>
  <div class="card glass">
    <div class="head"><img src="../../assets/sprites/levantando_pata/levantando_pata_0.png" alt="">Tito wants to</div>
    <div class="title" id="title"></div>
    <div class="detail" id="detail" hidden></div>
    <div class="reason" id="reason" hidden></div>
    <div class="spacer"></div>
    <div class="row">
      <span class="why" id="why"></span>
      <button id="deny">Don't allow</button>
      <button class="allow" id="allow" disabled>Allow</button>
    </div>
  </div>
  <script src="confirm.js"></script>
</body>
</html>
