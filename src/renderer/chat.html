<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; img-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'">
  <title>Chat with Tito</title>
  <link rel="stylesheet" href="glass.css">
  <style>
    * { box-sizing: border-box; }
    [hidden] { display: none !important; }
    html, body { margin: 0; height: 100%; background: transparent; color: var(--ink);
      font: 13.5px/1.45 -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
    body.no-vibrancy { background: linear-gradient(180deg, #eef2f6, #e3e8ee); }
    @media (prefers-color-scheme: dark) { body.no-vibrancy { background: linear-gradient(180deg, #23262d, #1b1d22); } }
    .app { display: flex; flex-direction: column; height: 100%; }
    header { -webkit-app-region: drag; display: flex; align-items: center; gap: 10px; padding: 10px 14px 8px 80px; min-height: 44px; }
    header img { width: 28px; height: 28px; object-fit: contain; }
    header .who { flex: 1; min-width: 0; }
    header .name { font-weight: 700; }
    header .sub { color: var(--ink-muted); font-size: 11.5px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    header button { -webkit-app-region: no-drag; }
    .btn { font: inherit; font-size: 12px; font-weight: 600; border: 1px solid var(--glass-divider); background: var(--glass-hover);
      color: var(--ink); border-radius: 9px; padding: 4px 10px; cursor: pointer; }
    .btn:hover { background: var(--glass-press); }
    .btn:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
    #log { flex: 1; overflow-y: auto; padding: 6px 14px 12px; display: flex; flex-direction: column; gap: 10px; }
    .msg { max-width: 86%; padding: 9px 12px; border-radius: 16px; white-space: pre-wrap; word-wrap: break-word; overflow-wrap: anywhere; }
    .msg > * { position: relative; z-index: 1; }
    .msg.user { align-self: flex-end; background: var(--accent); color: #fff; border-bottom-right-radius: 6px; }
    .msg.assistant { align-self: flex-start; border-bottom-left-radius: 6px; }
    .msg.assistant.typing::after { content: "▍"; animation: blink 1s steps(2) infinite; position: relative; z-index: 1; }
    @keyframes blink { 50% { opacity: 0; } }
    .msg code { font: 12px ui-monospace, SFMono-Regular, Menlo, monospace; background: rgba(127, 127, 127, .16); padding: 1px 4px; border-radius: 5px; }
    .msg pre { margin: 6px 0; padding: 8px 10px; border-radius: 10px; background: rgba(20, 24, 32, .82); color: #e8edf3; overflow-x: auto; white-space: pre; }
    .msg pre code { background: none; padding: 0; color: inherit; }
    .msg .meta { display: block; color: var(--ink-muted); font-size: 11px; margin-top: 4px; }
    .err { align-self: stretch; display: flex; gap: 10px; align-items: center; padding: 9px 12px; border-radius: 14px;
      color: #b4472a; background: rgba(208, 83, 58, .1); border: 1px solid rgba(208, 83, 58, .25); }
    @media (prefers-color-scheme: dark) { .err { color: #f3a387; } }
    .err span { flex: 1; }
    .empty { margin: auto; text-align: center; color: var(--ink-muted); max-width: 260px; }
    .empty img { width: 84px; height: 84px; object-fit: contain; display: block; margin: 0 auto 8px; }
    footer { padding: 8px 12px 12px; }
    .composer { display: flex; align-items: flex-end; gap: 8px; padding: 6px 6px 6px 12px; border-radius: 18px; }
    .composer > * { position: relative; z-index: 1; }
    textarea { flex: 1; resize: none; border: 0; outline: none; background: transparent; color: var(--ink);
      font: inherit; max-height: 140px; min-height: 22px; padding: 5px 0; }
    .send { width: 32px; height: 32px; border-radius: 50%; border: 0; background: var(--accent); color: #fff; cursor: pointer;
      display: flex; align-items: center; justify-content: center; flex: none; }
    .send:disabled { opacity: .4; cursor: default; }
    .send:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
    .send svg { width: 16px; height: 16px; fill: currentColor; }
    .hint { color: var(--ink-muted); font-size: 11px; text-align: center; margin-top: 6px; }
  </style>
</head>
<body>
  <div class="app">
    <header>
      <img src="../../assets/sprites/sentado/sentado_0.png" alt="">
      <div class="who">
        <div class="name">Tito</div>
        <div class="sub" id="sub">…</div>
      </div>
      <button class="btn" id="newChat" title="Start a new conversation">New chat</button>
    </header>
    <div id="log" role="log" aria-live="polite" aria-label="Conversation"></div>
    <footer>
      <div class="composer glass">
        <textarea id="input" rows="1" placeholder="Ask Tito anything…" aria-label="Message"></textarea>
        <button class="send" id="send" aria-label="Send" title="Send (Enter)">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3.4 20.4 21 12 3.4 3.6 3.4 10l12 2-12 2z"/></svg>
        </button>
      </div>
      <div class="hint" id="hint">Enter to send · Shift+Enter for a new line</div>
    </footer>
  </div>
  <script src="chat.js"></script>
</body>
</html>
